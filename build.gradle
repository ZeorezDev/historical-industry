plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'dev.zeorez'
version = '0.2.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    integration { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap','true'
            property 'mixin.env.refMapRemappingFile',layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath
            mods { historical_industry { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('industryClientTest')) {
                mods { industry_integration { source sourceSets.integration } }
                property 'industry.clientTest','true'
                args '--width','854','--height','480'
            }
        }
        server { args '--nogui' }
    }
}

repositories {
    flatDir { dirs project.findProperty('coreLibDir') ?: '../historicalnationscore/build/libs' }
    flatDir { dirs project.findProperty('railwaysLibDir') ?: '../historicaltrains/build/libs' }
    exclusiveContent {
        forRepository { maven { url = 'https://chocolateminecraft.com/maven' } }
        filter { includeGroup 'xaero.pac' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    compileOnly fg.deobf('dev.zeorez:historical_railways:0.1.0')
    implementation fg.deobf('dev.zeorez:historical_nations:0.6.0')
    implementation 'xaero.pac:open-parties-and-claims-forge-1.20.1:0.33.0:dev'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.matching { it.name in ['runClient','runServer'] }.configureEach { dependsOn 'createSrgToMcp' }
jar.finalizedBy('reobfJar')

tasks.register('integrationJar', Jar) {
    from sourceSets.integration.output
    archiveBaseName = 'industry-integration-tests'
    destinationDirectory = layout.buildDirectory.dir('integration')
}
reobf { integrationJar {} }
tasks.named('integrationJar') { finalizedBy 'reobfIntegrationJar' }
